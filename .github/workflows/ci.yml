name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Pull requests always run every job, so the checks a ruleset requires are never skipped.
    paths-ignore: ["**.md", "LICENSE*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes its older run; every commit to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    # The same Xcode generation as local development: older swift-format can't read the config.
    runs-on: macos-26
    # A hung hdiutil (the drive tests attach a disk image) would otherwise hold the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && xcrun swift-format --version
      - run: xcrun swift-format lint --strict --recursive StowawayCore App/Stowaway App/scripts/make-icon.swift
      - run: swift test --package-path StowawayCore -Xswiftc -warnings-as-errors

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An unsigned Release build of the App Store app, then the checks App Review cares about
      # that the source can't show (no test hooks in the binary, exact entitlements, privacy
      # manifest).
      - run: App/scripts/build.sh
      - run: App/scripts/check-release.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: shellcheck,zizmor
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: zizmor --format=github .github/workflows
      - run: shellcheck App/scripts/*.sh .githooks/*
