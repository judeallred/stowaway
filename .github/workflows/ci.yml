name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Pull requests always run every job, so the checks a ruleset requires are never skipped.
    paths-ignore: ["**.md", "LICENSE*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes its older run; every commit to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    # The same Xcode generation as local development: older swift-format can't read the config.
    runs-on: macos-26
    # A hung hdiutil (the drive tests attach a disk image) would otherwise hold the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && xcrun swift-format --version
      - run: xcrun swift-format lint --strict --recursive StowawayCore App/Stowaway App/scripts/make-icon.swift
      - run: swift test --package-path StowawayCore -Xswiftc -warnings-as-errors

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The committed Xcode project must be what App/project.yml generates (with the XcodeGen
      # version it was generated with).
      - run: |
          curl -sSLo "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet --spec App/project.yml
          git diff --exit-code App/Stowaway.xcodeproj
      # An unsigned Release build of the App Store app, then the checks App Review cares about
      # that the source can't show (no test hooks in the binary, exact entitlements, privacy
      # manifest).
      - run: App/scripts/build.sh
      - run: App/scripts/check-release.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck,zizmor
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: zizmor --format=github .
      - run: shellcheck install.sh App/scripts/*.sh .githooks/*
