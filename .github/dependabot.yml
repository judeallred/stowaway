version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Compatible updates arrive as one pull request; major versions come one at a time.
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
