[workspace]
resolver = "3"
members = ["crates/stowaway", "crates/stowaway-macos", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jude Allred"]
license-file = "LICENSE"
repository = "https://github.com/judeallred/stowaway"
homepage = "https://github.com/judeallred/stowaway"
description = "Keep dependency and build caches on an external drive, with seamless local fallback when it's unplugged."
readme = "README.md"
keywords = ["macos", "disk-space", "node-modules", "cargo", "cache"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
indexing_slicing = "warn"
as_conversions = "warn"
let_underscore_must_use = "warn"
create_dir = "warn"
exit = "warn"
# Every crate here shares one version of each dependency where possible; duplicates that
# come from upstream crates are reviewed in deny.toml instead.
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
